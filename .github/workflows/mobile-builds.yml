name: Build Misha Mobile

on:
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm --filter @workspace/misha-mobile exec expo prebuild --platform android --non-interactive --no-install

      - name: Make gradlew executable
        working-directory: artifacts/misha-mobile/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: artifacts/misha-mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: misha-android-apk
          path: artifacts/misha-mobile/android/app/build/outputs/apk/release/*.apk